      - name: Build and push Docker image
        if: steps.changes.outputs.identity == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.IdentityServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/identityserver.bonlinestore.com:latest
            scakir1978/identityserver.bonlinestore.com:${{ github.sha }}

      - name: Upload test results
        if: steps.changes.outputs.identity == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-test-results
          path: BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/TestResults/*.trx

  # ==================== DEVELOP BRANCH - DEVELOPMENT DEPLOYMENTS ====================
