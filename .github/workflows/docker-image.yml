  pr-ui:
    name: Test Build - UI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'BOnlineStore.UI/ClientApp/**'

      - name: Build Docker image
        if: steps.changes.outputs.ui == 'true'
        env:
          NODE_OPTIONS: --max_old_space_size=3072
          DOCKER_BUILDKIT: 1
        run: |
          cd BOnlineStore.UI/ClientApp
          docker build -f Dockerfile -t ui-test:${{ github.sha }} .
          echo "Docker image built successfully for pull request validation"

  pr-identityserver:
    name: Test Build - IdentityServer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            identity:
              - 'BOnlineStore.IdentityServer/**'
              - 'Shared/**'
              - 'BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/**'

      - name: Setup .NET 8
        if: steps.changes.outputs.identity == 'true'
