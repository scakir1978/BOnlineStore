      - name: Set up Docker Buildx
        if: steps.changes.outputs.production == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.CLOUD_BUILDER_NAME }}

      - name: Build and push Docker image
        if: steps.changes.outputs.production == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: scakir1978/production.bonlinestore.com:dev-${{ github.sha }}

  bff-service-development:
    name: Build and Deploy BFF Service (Development)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: BFFServiceDevelopmentDeploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
