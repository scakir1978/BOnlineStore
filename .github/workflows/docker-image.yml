          docker build -f BOnlineStore.IdentityServer/Dockerfile -t identityserver-test:${{ github.sha }} .
          echo "Docker image built successfully for pull request validation"

      - name: Upload test results
        if: steps.changes.outputs.identity == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-pr-test-results
          path: BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/TestResults/*.trx

  # ==================== MANUAL DEPLOYMENTS ====================
  manual-deployment:
    name: Manual Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 (for services with tests)
        if: contains(github.event.inputs.service, 'definitions') || contains(github.event.inputs.service, 'identityserver')
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Definitions Service Tests
        if: contains(github.event.inputs.service, 'definitions')
        run: |
          echo "Running unit tests for Definitions Service..."
          dotnet restore BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj
          dotnet test BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj --logger "trx;LogFileName=definitions-manual-test-results.trx" --no-restore

      - name: Run IdentityServer Tests
        if: contains(github.event.inputs.service, 'identityserver')
        run: |
          echo "Running unit tests for IdentityServer..."
          dotnet restore BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/BOnlineStore.IdentityServer.UnitTests.csproj
          dotnet test BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/BOnlineStore.IdentityServer.UnitTests.csproj --logger "trx;LogFileName=identity-manual-test-results.trx" --no-restore

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.CLOUD_BUILDER_NAME }}      

      - name: Build and Push - Definitions Production
        if: github.event.inputs.service == 'definitions-production'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/definitions.bonlinestore.com:latest
            scakir1978/definitions.bonlinestore.com:prod-${{ github.sha }}

      - name: Build and Push - Definitions Staging
        if: github.event.inputs.service == 'definitions-staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: scakir1978/definitions.bonlinestore.com:staging-${{ github.sha }}

      - name: Build and Push - Production Service Production
        if: github.event.inputs.service == 'production-service-production'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/production.bonlinestore.com:latest
            scakir1978/production.bonlinestore.com:prod-${{ github.sha }}

      - name: Build and Push - Production Service Staging
        if: github.event.inputs.service == 'production-service-staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: scakir1978/production.bonlinestore.com:staging-${{ github.sha }}

      - name: Build and Push - BFF Production
        if: github.event.inputs.service == 'bff-service-production'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/bff.bonlinestore.com:latest
            scakir1978/bff.bonlinestore.com:prod-${{ github.sha }}

      - name: Build and Push - BFF Staging
        if: github.event.inputs.service == 'bff-service-staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile
          platforms: linux/amd64
          push: true
          tags: scakir1978/bff.bonlinestore.com:staging-${{ github.sha }}

      - name: Build and Push - UI Production
        if: github.event.inputs.service == 'ui-production'
        uses: docker/build-push-action@v5
        with:
          context: BOnlineStore.UI/ClientApp
          file: BOnlineStore.UI/ClientApp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/ui.bonlinestore.com:latest
            scakir1978/ui.bonlinestore.com:prod-${{ github.sha }}

      - name: Build and Push - UI Staging
        if: github.event.inputs.service == 'ui-staging'
        uses: docker/build-push-action@v5
        with:
          context: BOnlineStore.UI/ClientApp
          file: BOnlineStore.UI/ClientApp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: scakir1978/ui.bonlinestore.com:staging-${{ github.sha }}

      - name: Build and Push - IdentityServer Production
        if: github.event.inputs.service == 'identityserver-production'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.IdentityServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/identityserver.bonlinestore.com:latest
            scakir1978/identityserver.bonlinestore.com:prod-${{ github.sha }}

      - name: Build and Push - IdentityServer Staging
        if: github.event.inputs.service == 'identityserver-staging'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.IdentityServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: scakir1978/identityserver.bonlinestore.com:staging-${{ github.sha }}

      - name: Upload test results
        if: always() && (contains(github.event.inputs.service, 'definitions') || contains(github.event.inputs.service, 'identityserver'))
        uses: actions/upload-artifact@v4
        with:
          name: manual-test-results
          path: |
            BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/TestResults/*.trx
            BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/TestResults/*.trx
