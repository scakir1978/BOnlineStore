name: CI/CD Pipeline for Multiple Services

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        type: choice
        options:
          - definitions-production
          - definitions-staging
          - production-service-production
          - production-service-staging
          - bff-service-production
          - bff-service-staging
          - ui-production
          - ui-staging
          - identityserver-production
          - identityserver-staging

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  CLOUD_BUILDER_NAME: ${{ secrets.CLOUD_BUILDER_NAME }}

jobs:
  # ==================== MAIN BRANCH - PRODUCTION DEPLOYMENTS ====================
  definitions-service-production:
    name: Build and Deploy Definitions Service
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: DefinitionsProductionDeploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            definitions:
              - 'BOnlineStore.Services/Definitions/**'
              - 'Shared/**'
              - 'BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/**'

      - name: Setup .NET 8
        if: steps.changes.outputs.definitions == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        if: steps.changes.outputs.definitions == 'true'
        run: |
          echo "Running unit tests for Definitions Service..."
          dotnet restore BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj
          dotnet test BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj --logger "trx;LogFileName=definitions-test-results.trx" --no-restore
          echo "Unit tests passed successfully!"

      - name: Login to Docker Hub
        if: steps.changes.outputs.definitions == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.definitions == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.CLOUD_BUILDER_NAME }}      

      - name: Build and push Docker image
        if: steps.changes.outputs.definitions == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/definitions.bonlinestore.com:latest
            scakir1978/definitions.bonlinestore.com:${{ github.sha }}

      - name: Upload test results
        if: steps.changes.outputs.definitions == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: definitions-test-results
          path: BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/TestResults/*.trx

  production-service-production:
    name: Build and Deploy Production Service
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ProductionProductionDeploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            production:
              - 'BOnlineStore.Services/Production/**'
              - 'Shared/**'

      - name: Login to Docker Hub
        if: steps.changes.outputs.production == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.production == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.CLOUD_BUILDER_NAME }}     

      - name: Build and push Docker image
        if: steps.changes.outputs.production == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/production.bonlinestore.com:latest
            scakir1978/production.bonlinestore.com:${{ github.sha }}

  bff-service-production:
    name: Build and Deploy BFF Service
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: BFFProductionDeploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bff:
              - 'BOnlineStore.Services/BFF/**'
              - 'Shared/**'
              - 'BOnlineStore.UnitTests/BOnlineStore.Services.BFF.UnitTests/**'

      - name: Login to Docker Hub
        if: steps.changes.outputs.bff == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.bff == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.CLOUD_BUILDER_NAME }}      

      - name: Build and push Docker image
        if: steps.changes.outputs.bff == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/bff.bonlinestore.com:latest
            scakir1978/bff.bonlinestore.com:${{ github.sha }}

  ui-production:
    name: Build and Deploy UI
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: UIProductionDeploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'BOnlineStore.UI/ClientApp/**'

      - name: Login to Docker Hub
        if: steps.changes.outputs.ui == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.ui == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.CLOUD_BUILDER_NAME }}

      - name: Build and push Docker image
        if: steps.changes.outputs.ui == 'true'
        uses: docker/build-push-action@v5
        with:
          context: BOnlineStore.UI/ClientApp
          file: BOnlineStore.UI/ClientApp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            scakir1978/ui.bonlinestore.com:latest
            scakir1978/ui.bonlinestore.com:${{ github.sha }}

  identityserver-production:
    name: Build and Deploy IdentityServer
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
