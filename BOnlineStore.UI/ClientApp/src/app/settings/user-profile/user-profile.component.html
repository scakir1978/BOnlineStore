<app-breadcrumbs
  title="{{ 'SETTINGS' | translate }}"
  [breadcrumbItems]="breadCrumbItems"
></app-breadcrumbs>

<!-- Loading Indicator -->
<dx-load-panel
  [visible]="isLoading"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  shadingColor="rgba(0,0,0,0.4)"
  [message]="'LOADING' | translate"
>
</dx-load-panel>

<!-- User Profile Form -->
<div *ngIf="userProfile && !isLoading">
  <form action="saveAction" (submit)="saveUserProfile($event)">
    <dx-form
      [formData]="userProfile"
      [labelLocation]="'left'"
      [alignItemLabelsInAllGroups]="true"
      [showValidationSummary]="true"
    >
      <!-- Kişisel Bilgiler -->
      <dxi-item
        itemType="group"
        [caption]="'USER_PROFILE.PERSONAL_INFO' | translate"
        [colCount]="3"
        [colSpan]="3"
      >
        <dxi-item
          dataField="givenName"
          [label]="{ text: ('USER_PROFILE.FIRST_NAME' | translate) }"
        >
          <dxi-validation-rule
            type="required"
            [message]="'USER_PROFILE.REQUIRED_FIRST_NAME' | translate"
          ></dxi-validation-rule>
        </dxi-item>

        <dxi-item
          dataField="familyName"
          [label]="{ text: ('USER_PROFILE.LAST_NAME' | translate) }"
        >
          <dxi-validation-rule
            type="required"
            [message]="'USER_PROFILE.REQUIRED_LAST_NAME' | translate"
          ></dxi-validation-rule>
        </dxi-item>

        <dxi-item
          dataField="middleName"
          [label]="{ text: ('USER_PROFILE.MIDDLE_NAME' | translate) }"
        >
        </dxi-item>

        <dxi-item
          dataField="name"
          [label]="{ text: ('USER_PROFILE.FULL_NAME' | translate) }"
        >
        </dxi-item>

        <dxi-item
          dataField="nickname"
          [label]="{ text: ('USER_PROFILE.NICKNAME' | translate) }"
        >
        </dxi-item>

        <dxi-item
          dataField="preferredUsername"
          [label]="{
            text: ('USER_PROFILE.PREFERRED_USERNAME' | translate)
          }"
        >
        </dxi-item>
      </dxi-item>

      <!-- İletişim Bilgileri -->
      <dxi-item
        itemType="group"
        [caption]="'USER_PROFILE.CONTACT_INFO' | translate"
        [colCount]="3"
        [colSpan]="3"
      >
        <dxi-item
          dataField="email"
          [label]="{ text: ('USER_PROFILE.EMAIL' | translate) }"
          [editorOptions]="{ disabled: true }"
        >
          <dxi-validation-rule
            type="required"
            [message]="'USER_PROFILE.EMAIL_REQUIRED' | translate"
          ></dxi-validation-rule>
          <dxi-validation-rule
            type="email"
            [message]="'USER_PROFILE.EMAIL_INVALID' | translate"
          ></dxi-validation-rule>
        </dxi-item>

        <dxi-item
          dataField="phoneNumber"
          [label]="{ text: ('USER_PROFILE.PHONE_NUMBER' | translate) }"
        >
        </dxi-item>

        <dxi-item
          dataField="website"
          [label]="{ text: ('USER_PROFILE.WEBSITE' | translate) }"
        >
        </dxi-item>
      </dxi-item>

      <!-- Profil Bilgileri -->
      <dxi-item
        itemType="group"
        [caption]="'USER_PROFILE.PROFILE_INFO' | translate"
        [colCount]="2"
        [colSpan]="3"
      >
        <dxi-item
          dataField="gender"
          editorType="dxSelectBox"
          [label]="{ text: ('USER_PROFILE.GENDER' | translate) }"
          [editorOptions]="{
            items: genderOptions,
            displayExpr: 'text',
            valueExpr: 'value',
            searchEnabled: true,
            placeholder: ('USER_PROFILE.SELECT_GENDER' | translate)
          }"
        >
        </dxi-item>

        <dxi-item
          dataField="birthdate"
          editorType="dxDateBox"
          [label]="{ text: ('USER_PROFILE.BIRTHDATE' | translate) }"
          [editorOptions]="{
            type: 'date',
            displayFormat: 'dd.MM.yyyy',
            placeholder: ('USER_PROFILE.SELECT_BIRTHDATE' | translate),
            max: maxBirthDate
          }"
        >
        </dxi-item>
        <dxi-item
          dataField="profile"
          [label]="{ text: ('USER_PROFILE.PROFILE_URL' | translate) }"
        >
        </dxi-item>

        <dxi-item
          dataField="picture"
          [label]="{ text: ('USER_PROFILE.PICTURE_URL' | translate) }"
        >
        </dxi-item>
      </dxi-item>

      <!-- Yerelleştirme Ayarları -->
      <dxi-item
        itemType="group"
        [caption]="'USER_PROFILE.LOCALIZATION_SETTINGS' | translate"
        [colCount]="2"
        [colSpan]="2"
      >
        <dxi-item
          dataField="locale"
          editorType="dxSelectBox"
          [label]="{ text: ('USER_PROFILE.LOCALE' | translate) }"
          [editorOptions]="{
            items: localeOptions,
            displayExpr: 'text',
            valueExpr: 'value',
            searchEnabled: true,
            placeholder: ('USER_PROFILE.SELECT_LOCALE' | translate)
          }"
        >
        </dxi-item>

        <dxi-item
          dataField="zoneInfo"
          editorType="dxSelectBox"
          [label]="{ text: ('USER_PROFILE.ZONE_INFO' | translate) }"
          [editorOptions]="{
            items: timeZoneOptions,
            displayExpr: 'text',
            valueExpr: 'value',
            searchEnabled: true,
            searchMode: 'contains',
            placeholder: ('USER_PROFILE.SELECT_TIMEZONE' | translate)
          }"
        >
        </dxi-item>
      </dxi-item>

      <!-- Buttons -->
      <dxi-item itemType="group" [colSpan]="3">
        <dxi-item
          itemType="button"
          [buttonOptions]="{
            text: ('SAVE' | translate),
            type: 'normal',
            icon: 'save',
            disabled: isSaving,
            useSubmitBehavior: true
          }"
        >
        </dxi-item>
      </dxi-item>
    </dx-form>
  </form>
</div>

<!-- No Data Message -->
<div *ngIf="!userProfile && !isLoading" class="no-data">
  <div class="text-center p-5">
    <i class="ri-user-search-line display-1 text-muted"></i>
    <h5 class="mt-3">{{ "USER_PROFILE.NO_DATA_TITLE" | translate }}</h5>
    <p class="text-muted">
      {{ "USER_PROFILE.NO_DATA_DESC" | translate }}
    </p>
  </div>
</div>
