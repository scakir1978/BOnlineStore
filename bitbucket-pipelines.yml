                - echo "Cloud build completed successfully!"
              services:
                - docker

          # UI Angular Project Pipeline
          - step:
              name: Build and Deploy UI
              deployment: UIProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.UI/ClientApp/**"
              script:
                # Setup Docker Buildx
                - echo "Setting up Docker Buildx for Cloud Builder..."
                - apt-get update && apt-get install -y jq
                - mkdir -vp ~/.docker/cli-plugins/
                - ARCH=amd64
