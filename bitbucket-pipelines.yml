            # Login and build with Cloud Builder
            - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
            - docker buildx create --use --driver cloud "${DOCKERHUB_USERNAME}/${CLOUD_BUILDER_NAME}"
            - docker buildx build --platform linux/amd64 --file BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile --tag scakir1978/bff.bonlinestore.com:staging-$BITBUCKET_COMMIT --push .
          services:
            - docker

