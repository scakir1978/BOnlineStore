                - curl --silent -L --output ~/.docker/cli-plugins/docker-buildx $BUILDX_URL
                - chmod a+x ~/.docker/cli-plugins/docker-buildx
                
                # Login to Docker Hub and setup Cloud Builder
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                - docker buildx create --use --driver cloud "${DOCKERHUB_USERNAME}/${CLOUD_BUILDER_NAME}"
                
                # Build and push using Docker Cloud Builder
                - cd BOnlineStore.UI/ClientApp
                - echo "Building with Docker Cloud Builder..."
                - docker buildx build --platform linux/amd64 --file Dockerfile --tag scakir1978/ui.bonlinestore.com:latest --tag scakir1978/ui.bonlinestore.com:$BITBUCKET_COMMIT --push .
                - echo "Cloud build completed successfully!"
              services:
                - docker
              caches:
                - node

          # IdentityServer Pipeline
          - step:
              name: Build and Deploy IdentityServer
              deployment: IdentityProductionDeploy
              image: mcr.microsoft.com/dotnet/sdk:8.0
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.IdentityServer/**"
