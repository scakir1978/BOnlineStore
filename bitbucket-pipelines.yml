              script:
                # Login to Docker Hub
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Build and push development version
                - docker build -f BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile -t scakir1978/bff.bonlinestore.com:dev-$BITBUCKET_COMMIT .
                - docker push scakir1978/bff.bonlinestore.com:dev-$BITBUCKET_COMMIT
                
                # Clean up
                - docker rmi scakir1978/bff.bonlinestore.com:dev-$BITBUCKET_COMMIT || true
              services:
                - docker
              caches:
                - docker-cache

          # UI Angular Project Development Pipeline - Enhanced with larger memory
          - step:
              name: Build and Deploy UI (Development)
              deployment: UIDevelopmentDeploy
              size: 4x  # Increased memory allocation for UI builds
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.UI/ClientApp/**"
              script:
                # Set memory optimization environment variables
                - export NODE_OPTIONS="--max_old_space_size=3072"
                - export DOCKER_BUILDKIT=1
                
                # Login to Docker Hub
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Change to the Angular project directory and build development version
                - cd BOnlineStore.UI/ClientApp
                - docker build --memory=6g --memory-swap=8g -f Dockerfile -t scakir1978/ui.bonlinestore.com:dev-$BITBUCKET_COMMIT .
                - docker push scakir1978/ui.bonlinestore.com:dev-$BITBUCKET_COMMIT
                
                # Clean up
                - docker rmi scakir1978/ui.bonlinestore.com:dev-$BITBUCKET_COMMIT || true
              services:
