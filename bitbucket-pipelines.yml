# Bitbucket Pipelines CI/CD Configuration for Multiple Services
# This pipeline automatically builds and pushes Docker images when code is pushed to repository
# Prerequisites: $DOCKERHUB_USERNAME, $DOCKERHUB_PASSWORD setup as deployment variables

image: atlassian/default-image:3

pipelines:
  # Automatic builds on branch changes
  branches:
    main:
      - parallel:
          # Definitions Service Pipeline
          - step:
              name: Build and Deploy Definitions Service
              deployment: DefinitionsProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Definitions/**"
                    - "Shared/**"
                    - "Shared/BOnlineStore.Generic.Service/**"
                    - "Shared/BOnlineStore.Localization/**"
                    - "Shared/BOnlineStore.MongoDb.GenericRepository/**"
              script:
                # Run unit tests for Definitions Service first
                - echo "Running unit tests for Definitions Service..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj --filter "FullyQualifiedName~DefinitionsService" --logger "trx;LogFileName=definitions-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Login to Docker Hub using environment variables
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Build the Docker image using the specific Dockerfile
                - docker build -f BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile -t scakir1978/definitions.bonlinestore.com:latest .
                - docker tag scakir1978/definitions.bonlinestore.com:latest scakir1978/definitions.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Push both latest and commit-specific tags
                - docker push scakir1978/definitions.bonlinestore.com:latest
                - docker push scakir1978/definitions.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Clean up local images to save space
                - docker rmi scakir1978/definitions.bonlinestore.com:latest || true
                - docker rmi scakir1978/definitions.bonlinestore.com:$BITBUCKET_COMMIT || true
              services:
                - docker
              caches:
                - docker-cache
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/TestResults/*.trx

          # Production Service Pipeline
          - step:
              name: Build and Deploy Production Service
              deployment: ProductionProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Production/**"
                    - "Shared/**"
                    - "Shared/BOnlineStore.Generic.Service/**"
                    - "Shared/BOnlineStore.Localization/**"
                    - "Shared/BOnlineStore.MongoDb.GenericRepository/**"
              script:
                # Login to Docker Hub using environment variables
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Build the Docker image using the specific Dockerfile
                - docker build -f BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile -t scakir1978/production.bonlinestore.com:latest .
                - docker tag scakir1978/production.bonlinestore.com:latest scakir1978/production.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Push both latest and commit-specific tags
                - docker push scakir1978/production.bonlinestore.com:latest
                - docker push scakir1978/production.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Clean up local images to save space
                - docker rmi scakir1978/production.bonlinestore.com:latest || true
                - docker rmi scakir1978/production.bonlinestore.com:$BITBUCKET_COMMIT || true
              services:
                - docker
              caches:
                - docker-cache

          # BFF Service Pipeline
          - step:
              name: Build and Deploy BFF Service
              deployment: BFFProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/BFF/**"
                    - "Shared/**"
                    - "Shared/BOnlineStore.Generic.Service/**"
                    - "Shared/BOnlineStore.Localization/**"
                    - "Shared/BOnlineStore.MongoDb.GenericRepository/**"
              script:
                # Login to Docker Hub using environment variables
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Build the Docker image using the specific Dockerfile
                - docker build -f BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile -t scakir1978/bff.bonlinestore.com:latest .
                - docker tag scakir1978/bff.bonlinestore.com:latest scakir1978/bff.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Push both latest and commit-specific tags
                - docker push scakir1978/bff.bonlinestore.com:latest
                - docker push scakir1978/bff.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Clean up local images to save space
                - docker rmi scakir1978/bff.bonlinestore.com:latest || true
                - docker rmi scakir1978/bff.bonlinestore.com:$BITBUCKET_COMMIT || true
              services:
                - docker
              caches:
                - docker-cache

          # UI Angular Project Pipeline - Enhanced with larger memory and build optimizations
          - step:
              name: Build and Deploy UI
              deployment: UIProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.UI/ClientApp/**"
              script:
                # Set memory optimization environment variables
                - export NODE_OPTIONS="--max_old_space_size=3072"
                - export DOCKER_BUILDKIT=1
                
                # Login to Docker Hub using environment variables
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Change to the Angular project directory and build the Docker image with memory optimizations
                - cd BOnlineStore.UI/ClientApp
                - docker build --memory=6g --memory-swap=8g -f Dockerfile -t scakir1978/ui.bonlinestore.com:latest .
                - docker tag scakir1978/ui.bonlinestore.com:latest scakir1978/ui.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Push both latest and commit-specific tags
                - docker push scakir1978/ui.bonlinestore.com:latest
                - docker push scakir1978/ui.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Clean up local images to save space
                - docker rmi scakir1978/ui.bonlinestore.com:latest || true
                - docker rmi scakir1978/ui.bonlinestore.com:$BITBUCKET_COMMIT || true
              services:
                - docker
              caches:
                - docker-cache
                - node

          # IdentityServer Pipeline
          - step:
              name: Build and Deploy IdentityServer
              deployment: IdentityProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.IdentityServer/**"
                    - "Shared/**"
              script:
                # Run unit tests for IdentityServer first
                - echo "Running unit tests for IdentityServer..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj --filter "FullyQualifiedName~IdentityService" --logger "trx;LogFileName=identity-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Login to Docker Hub using environment variables
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                
                # Build the Docker image using the specific Dockerfile
                - docker build -f BOnlineStore.IdentityServer/Dockerfile -t scakir1978/identityserver.bonlinestore.com:latest .
                - docker tag scakir1978/identityserver.bonlinestore.com:latest scakir1978/identityserver.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Push both latest and commit-specific tags
                - docker push scakir1978/identityserver.bonlinestore.com:latest
                - docker push scakir1978/identityserver.bonlinestore.com:$BITBUCKET_COMMIT
                
                # Clean up local images to save space
                - docker rmi scakir1978/identityserver.bonlinestore.com:latest || true
                - docker rmi scakir1978/identityserver.bonlinestore.com:$BITBUCKET_COMMIT || true
              services:
                - docker
              caches:
                - docker-cache
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/TestResults/*.trx

