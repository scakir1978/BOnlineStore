            - dotnetcore
          artifacts:
            - BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/TestResults/*.trx

  # Pull request builds for testing
  pull-requests:
    '**':
      - parallel:
          # Definitions Service Test Build
          - step:
              name: Test Build - Definitions Service
              image: mcr.microsoft.com/dotnet/sdk:8.0
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Definitions/**"
                    - "Shared/**"
                    - "BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/**"
              script:
                # Set UTF-8 encoding for Turkish characters
                - export LANG=tr_TR.UTF-8
                - export LC_ALL=tr_TR.UTF-8
                
                # Run unit tests first
                - echo "Running unit tests for Definitions Service..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj --logger "trx;LogFileName=definitions-pr-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Build Docker image (no push for PR)
                - docker build -f BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile -t definitions-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/TestResults/*.trx

          # Production Service Test Build
          - step:
              name: Test Build - Production Service              
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Production/**"
                    - "Shared/**"
              script:
                # Build Docker image (no push for PR)
                - docker build -f BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile -t production-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache

          # BFF Service Test Build
          - step:
              name: Test Build - BFF Service              
              size: 2x  
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/BFF/**"
                    - "Shared/**"
              script:
                # Build Docker image (no push for PR)
                - docker build -f BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile -t bff-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache

          # UI Angular Project Test Build
          - step:
              name: Test Build - UI
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.UI/ClientApp/**"
              script:
                # Set memory optimization environment variables
                - export NODE_OPTIONS="--max_old_space_size=3072"
                - export DOCKER_BUILDKIT=1
                
                # Build Docker image (no push for PR)
                - cd BOnlineStore.UI/ClientApp
                - docker build --memory=6g --memory-swap=8g -f Dockerfile -t ui-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache
                - node

          # IdentityServer Test Build
          - step:
              name: Test Build - IdentityServer
              image: mcr.microsoft.com/dotnet/sdk:8.0
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.IdentityServer/**"
                    - "Shared/**"
                    - "BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/**"
              script:
                # Set UTF-8 encoding for Turkish characters
                - export LANG=tr_TR.UTF-8
                - export LC_ALL=tr_TR.UTF-8
                
                # Run unit tests first
                - echo "Running unit tests for IdentityServer..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/BOnlineStore.IdentityServer.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/BOnlineStore.IdentityServer.UnitTests.csproj --logger "trx;LogFileName=identity-pr-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Build Docker image (no push for PR)
                - docker build -f BOnlineStore.IdentityServer/Dockerfile -t identityserver-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/BOnlineStore.IdentityServer.UnitTests/TestResults/*.trx

definitions:
  services:
    docker:
      memory: 7168
  caches:
    node: node_modules
    dotnetcore: ~/.nuget/packages
