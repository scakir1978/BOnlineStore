            - dotnet restore BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj
            - dotnet test BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj --filter "FullyQualifiedName~IdentityService" --logger "trx;LogFileName=identity-manual-test-results.trx" --no-restore
