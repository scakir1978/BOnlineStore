  # Pull request builds for testing
  pull-requests:
    '**':
      - parallel:
          # Definitions Service Test Build
          - step:
              name: Test Build - Definitions Service
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Definitions/**"
                    - "Shared/**"
                    - "Shared/BOnlineStore.Generic.Service/**"
                    - "Shared/BOnlineStore.Localization/**"
                    - "Shared/BOnlineStore.MongoDb.GenericRepository/**"
              script:
                # Run unit tests for Definitions Service first
                - echo "Running unit tests for Definitions Service..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj --filter "FullyQualifiedName~DefinitionsService" --logger "trx;LogFileName=definitions-pr-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Only build, don't push for PR validation
                - docker build -f BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile -t definitions-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/TestResults/*.trx

          # Production Service Test Build
          - step:
              name: Test Build - Production Service
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Production/**"
                    - "Shared/**"
                    - "Shared/BOnlineStore.Generic.Service/**"
                    - "Shared/BOnlineStore.Localization/**"
                    - "Shared/BOnlineStore.MongoDb.GenericRepository/**"
              script:
                # Only build, don't push for PR validation
                - docker build -f BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile -t production-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache

          # BFF Service Test Build
          - step:
              name: Test Build - BFF Service
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/BFF/**"
                    - "Shared/**"
                    - "Shared/BOnlineStore.Generic.Service/**"
                    - "Shared/BOnlineStore.Localization/**"
                    - "Shared/BOnlineStore.MongoDb.GenericRepository/**"
              script:
                # Only build, don't push for PR validation
                - docker build -f BOnlineStore.Services/BFF/BOnlineStore.BFF/Dockerfile -t bff-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache

          # UI Angular Project Test Build - Enhanced with larger memory
          - step:
              name: Test Build - UI
              size: 4x  # Increased memory allocation
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.UI/ClientApp/**"
              script:
                # Set memory optimization environment variables
                - export NODE_OPTIONS="--max_old_space_size=3072"
                - export DOCKER_BUILDKIT=1
                
                # Only build, don't push for PR validation
                - cd BOnlineStore.UI/ClientApp
                - docker build --memory=6g --memory-swap=8g -f Dockerfile -t ui-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache
                - node

          # IdentityServer Test Build
          - step:
              name: Test Build - IdentityServer
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.IdentityServer/**"
                    - "Shared/**"
              script:
                # Run unit tests for IdentityServer first
                - echo "Running unit tests for IdentityServer..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.UnitTests.csproj --filter "FullyQualifiedName~IdentityService" --logger "trx;LogFileName=identity-pr-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Only build, don't push for PR validation
                - docker build -f BOnlineStore.IdentityServer/Dockerfile -t identityserver-test:$BITBUCKET_COMMIT .
                - echo "Docker image built successfully for pull request validation"
              services:
                - docker
              caches:
                - docker-cache
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/TestResults/*.trx

definitions:
  services:
    docker:
      memory: 7168  # Reduced from 8192 to 7168MB (7GB) to leave 1GB for step scripts
  caches:
    docker-cache: ~/.docker
    node: node_modules
    dotnetcore: ~/.nuget/packages
