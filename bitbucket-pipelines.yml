# Bitbucket Pipelines CI/CD Configuration for Multiple Services
# This pipeline automatically builds and pushes Docker images when code is pushed to repository
# Prerequisites: $DOCKERHUB_USERNAME, $DOCKERHUB_PASSWORD, $CLOUD_BUILDER_NAME setup as deployment variables

image: atlassian/default-image:3

pipelines:
  # Automatic builds on branch changes
  branches:
    main:
      - parallel:
          # Definitions Service Pipeline
          - step:
              name: Build and Deploy Definitions Service
              deployment: DefinitionsProductionDeploy
              image: mcr.microsoft.com/dotnet/sdk:8.0
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Definitions/**"
                    - "Shared/**"
                    - "BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/**"
              script:
                # Set UTF-8 encoding for Turkish characters
                - export LANG=tr_TR.UTF-8
                - export LC_ALL=tr_TR.UTF-8
                
                # Run unit tests first
                - echo "Running unit tests for Definitions Service..."
                - dotnet restore BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj
                - dotnet test BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests.csproj --logger "trx;LogFileName=definitions-test-results.trx" --no-restore
                - echo "Unit tests passed successfully!"
                
                # Setup Docker Buildx
                - echo "Setting up Docker Buildx for Cloud Builder..."                
                - apt-get update && apt-get install -y jq
                - mkdir -vp ~/.docker/cli-plugins/
                - ARCH=amd64
                - BUILDX_URL=$(curl -s https://raw.githubusercontent.com/docker/actions-toolkit/main/.github/buildx-lab-releases.json | jq -r ".latest.assets[] | select(endswith(\"linux-$ARCH\"))")
                - curl --silent -L --output ~/.docker/cli-plugins/docker-buildx $BUILDX_URL
                - chmod a+x ~/.docker/cli-plugins/docker-buildx
                
                # Login to Docker Hub and setup Cloud Builder
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                - docker buildx create --use --driver cloud "${DOCKERHUB_USERNAME}/${CLOUD_BUILDER_NAME}"
                
                # Build and push using Docker Cloud Builder (multi-platform)
                - echo "Building with Docker Cloud Builder..."
                - docker buildx build --platform linux/amd64 --file BOnlineStore.Services/Definitions/BOnlineStore.Services.Definitions.Api/Dockerfile --tag scakir1978/definitions.bonlinestore.com:latest --tag scakir1978/definitions.bonlinestore.com:$BITBUCKET_COMMIT --push .
                - echo "Cloud build completed successfully!"
              services:
                - docker
              caches:
                - dotnetcore
              artifacts:
                - BOnlineStore.UnitTests/BOnlineStore.Services.Definitions.Api.UnitTests/TestResults/*.trx

          # Production Service Pipeline
          - step:
              name: Build and Deploy Production Service
              deployment: ProductionProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/Production/**"
                    - "Shared/**"
              script:
                # Setup Docker Buildx
                - echo "Setting up Docker Buildx for Cloud Builder..."
                - apt-get update && apt-get install -y jq
                - mkdir -vp ~/.docker/cli-plugins/
                - ARCH=amd64
                - BUILDX_URL=$(curl -s https://raw.githubusercontent.com/docker/actions-toolkit/main/.github/buildx-lab-releases.json | jq -r ".latest.assets[] | select(endswith(\"linux-$ARCH\"))")
                - curl --silent -L --output ~/.docker/cli-plugins/docker-buildx $BUILDX_URL
                - chmod a+x ~/.docker/cli-plugins/docker-buildx
                
                # Login to Docker Hub and setup Cloud Builder
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                - docker buildx create --use --driver cloud "${DOCKERHUB_USERNAME}/${CLOUD_BUILDER_NAME}"
                
                # Build and push using Docker Cloud Builder
                - echo "Building with Docker Cloud Builder..."
                - docker buildx build --platform linux/amd64 --file BOnlineStore.Services/Production/BOnlineStore.Services.Production.Api/Dockerfile --tag scakir1978/production.bonlinestore.com:latest --tag scakir1978/production.bonlinestore.com:$BITBUCKET_COMMIT --push .
                - echo "Cloud build completed successfully!"
              services:
                - docker

          # BFF Service Pipeline
          - step:
              name: Build and Deploy BFF Service
              deployment: BFFProductionDeploy
              size: 2x
              condition:
                changesets:
                  includePaths:
                    - "BOnlineStore.Services/BFF/**"
                    - "Shared/**"
              script:
                # Setup Docker Buildx
                - echo "Setting up Docker Buildx for Cloud Builder..."
                - apt-get update && apt-get install -y jq       
                - mkdir -vp ~/.docker/cli-plugins/
                - ARCH=amd64
                - BUILDX_URL=$(curl -s https://raw.githubusercontent.com/docker/actions-toolkit/main/.github/buildx-lab-releases.json | jq -r ".latest.assets[] | select(endswith(\"linux-$ARCH\"))")
                - curl --silent -L --output ~/.docker/cli-plugins/docker-buildx $BUILDX_URL
                - chmod a+x ~/.docker/cli-plugins/docker-buildx
                
                # Login to Docker Hub and setup Cloud Builder
                - echo $DOCKERHUB_PASSWORD | docker login --username $DOCKERHUB_USERNAME --password-stdin
                - docker buildx create --use --driver cloud "${DOCKERHUB_USERNAME}/${CLOUD_BUILDER_NAME}"
                
                # Build and push using Docker Cloud Builder
                - echo "Building with Docker Cloud Builder..."
