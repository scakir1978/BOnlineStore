            - docker buildx create --use --driver cloud "${DOCKERHUB_USERNAME}/${CLOUD_BUILDER_NAME}"
            - docker buildx build --platform linux/amd64 --file BOnlineStore.IdentityServer/Dockerfile --tag scakir1978/identityserver.bonlinestore.com:staging-$BITBUCKET_COMMIT --push .
